<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Banner João Victor</title>
  <desc id="desc">Banner animado com ondas coloridas, nome João Victor e uma frase sobre desenvolvimento.</desc>

  <defs>
    <linearGradient id="animatedBg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28D9">
        <animate attributeName="stop-color" values="#6D28D9;#0891B2;#DB2777;#7C3AED;#6D28D9" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.45" stop-color="#0891B2">
        <animate attributeName="stop-color" values="#0891B2;#22C55E;#6366F1;#06B6D4;#0891B2" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#DB2777">
        <animate attributeName="stop-color" values="#DB2777;#F97316;#0EA5E9;#A855F7;#DB2777" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveLight" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="waveDark" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#020617" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.44"/>
    </linearGradient>

    <clipPath id="bannerClip">
      <rect x="18" y="24" width="1164" height="292" rx="0"/>
    </clipPath>
  </defs>

  <rect width="1200" height="340" fill="#0D1117"/>

  <rect x="28" y="34" width="1164" height="292" fill="#020617" opacity="0.34"/>

  <g>
    <rect x="18" y="24" width="1164" height="292" fill="url(#animatedBg)"/>

    <g clip-path="url(#bannerClip)">
      <path fill="url(#waveLight)" opacity="0.72"
        d="M-80 130 C120 82 250 178 440 134 C640 88 790 82 980 126 C1100 154 1210 132 1280 98 L1280 0 L-80 0 Z">
        <animate attributeName="d" dur="7s" repeatCount="indefinite"
          values="
            M-80 130 C120 82 250 178 440 134 C640 88 790 82 980 126 C1100 154 1210 132 1280 98 L1280 0 L-80 0 Z;
            M-80 116 C100 170 270 72 450 118 C640 166 790 154 980 104 C1110 70 1210 92 1280 132 L1280 0 L-80 0 Z;
            M-80 130 C120 82 250 178 440 134 C640 88 790 82 980 126 C1100 154 1210 132 1280 98 L1280 0 L-80 0 Z"/>
      </path>

      <path fill="url(#waveDark)" opacity="0.68"
        d="M-80 222 C90 186 260 236 440 198 C630 158 790 184 980 160 C1110 144 1208 152 1280 136 L1280 340 L-80 340 Z">
        <animate attributeName="d" dur="8s" repeatCount="indefinite"
          values="
            M-80 222 C90 186 260 236 440 198 C630 158 790 184 980 160 C1110 144 1208 152 1280 136 L1280 340 L-80 340 Z;
            M-80 192 C120 238 260 168 440 210 C640 256 800 206 980 188 C1110 174 1210 204 1280 176 L1280 340 L-80 340 Z;
            M-80 222 C90 186 260 236 440 198 C630 158 790 184 980 160 C1110 144 1208 152 1280 136 L1280 340 L-80 340 Z"/>
      </path>

      <path fill="#020617" opacity="0.20"
        d="M-80 276 C120 234 300 292 500 250 C680 212 830 230 1000 206 C1130 188 1220 206 1280 190 L1280 340 L-80 340 Z">
        <animate attributeName="d" dur="10s" repeatCount="indefinite"
          values="
            M-80 276 C120 234 300 292 500 250 C680 212 830 230 1000 206 C1130 188 1220 206 1280 190 L1280 340 L-80 340 Z;
            M-80 244 C110 286 300 220 500 264 C690 306 840 250 1000 236 C1130 224 1220 250 1280 220 L1280 340 L-80 340 Z;
            M-80 276 C120 234 300 292 500 250 C680 212 830 230 1000 206 C1130 188 1220 206 1280 190 L1280 340 L-80 340 Z"/>
      </path>

      <rect x="18" y="24" width="1164" height="292" fill="#020617" opacity="0.06"/>
