  <text x="600" y="156" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="3" fill="#F8FAFC">JOÃO VICTOR</text>
  <line x1="418" y1="182" x2="782" y2="182" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" opacity="0.86"/>
  <text x="600" y="252" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="0" fill="#E0F2FE">Desenvolvendo aplicacoes web com codigo limpo, interfaces objetivas e solucoes que evoluem.</text>
