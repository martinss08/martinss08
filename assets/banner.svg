<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Banner João Victor</title>
  <desc id="desc">Banner com fundo em gradiente e o nome João Victor em destaque.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="0.42" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="shadow" x1="250" y1="190" x2="1180" y2="240" gradientUnits="userSpaceOnUse">
